# Runs the tests, then checks that every expected test ran once.
# ProofScope is public main 4630995155f3976ec89f48099beb8abcb68c5a49.
# Checkout is actions/checkout v7.0.1. Python setup is actions/setup-python v7.1.0.
name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest==9.1.1
      - name: Run the suite
        run: python -m pytest test_silenceproof.py --junitxml=build/junit.xml
      - name: Check that every expected test ran
        uses: UnreachedWorld/proofscope@4630995155f3976ec89f48099beb8abcb68c5a49
        with:
          expected: expected-tests.txt
          results: |
            build/junit.xml
